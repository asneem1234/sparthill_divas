<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Click It overlay</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="buddy-anchor">
      <!-- Triangle, waveform and spinner cross-fade; they stay in the tree to avoid a cursor "pop". -->
      <div id="cursor-visuals">
        <div id="triangle-scale-wrapper">
          <svg id="triangle" width="24" height="24" viewBox="-12 -12 24 24">
            <polygon points="0,-9.2376 -8,4.6188 8,4.6188" fill="#FF4FA3" />
          </svg>
        </div>
        <div id="waveform">
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
        </div>
        <div id="spinner"></div>
      </div>

      <div id="welcome-bubble" class="speech-bubble"></div>
      <div id="prompt-bubble" class="speech-bubble"></div>
      <div id="navigation-bubble" class="speech-bubble"></div>
    </div>

    <script src="overlay.js"></script>
  </body>
</html>
