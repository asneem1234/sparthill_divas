<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Choose what Click It can see</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <div id="window">
      <header class="header">
        <div>
          <h1 class="heading">Choose what Click It can see</h1>
          <p class="subheading">Only the one you pick is captured. It's checked on your PC first, and anything that looks like a password or secret is never sent.</p>
        </div>
        <button id="close-button" class="icon-button" aria-label="Cancel">
          <svg viewBox="0 0 10 10" width="10" height="10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg>
        </button>
      </header>
      <div class="divider"></div>

      <div id="status" class="status">Looking for your windows...</div>
      <div id="grid" class="grid" role="listbox" aria-label="Windows you can choose"></div>

      <footer class="footer">
        Browser windows show the tab you're on, so switch to the tab you want first. Minimized windows aren't listed.
      </footer>
    </div>
    <script src="picker.js"></script>
  </body>
</html>
