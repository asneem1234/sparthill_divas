<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Click It - Snap</title>
    <link rel="stylesheet" href="region.css" />
  </head>
  <body>
    <img id="frozen-picture" alt="" draggable="false" />
    <div id="dim"></div>
    <div id="hint" class="hint">Drag to choose the area to snap. Esc to cancel.</div>

    <div id="selection" class="selection hidden">
      <div id="size-label" class="size-label"></div>
    </div>

    <div id="toolbar" class="toolbar hidden">
      <button id="snap-button" class="snap-button" title="Snap this area (Enter)">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" /><circle cx="12" cy="12" r="2.6" /></svg>
        Snap
      </button>
      <button id="cancel-button" class="cancel-button" title="Cancel (Esc)">Cancel</button>
    </div>

    <script src="region.js"></script>
  </body>
</html>
