<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <link rel="stylesheet" href="panel.css" />
    <title>ClickIt</title>
  </head>
  <body>
    <main>
      <header>
        <h1>ClickIt</h1>
        <span id="state" class="state" role="status" aria-live="polite">idle</span>
      </header>

      <p id="hotkey-hint" class="hint"></p>

      <section aria-labelledby="actions-heading">
        <h2 id="actions-heading">Actions</h2>
        <div class="actions">
          <button type="button" data-action="menu">Radial menu</button>
          <button type="button" data-action="screenshot">Snap screen</button>
          <button type="button" data-action="select-area">Select area</button>
          <button type="button" data-action="translate">Translate area</button>
          <button type="button" data-action="reminders">Reminders</button>
          <button type="button" data-action="voice">Voice</button>
        </div>
      </section>

      <section aria-labelledby="setup-heading">
        <h2 id="setup-heading">Setup</h2>
        <label for="worker-url">Worker URL</label>
        <input id="worker-url" type="url" placeholder="https://your-worker.workers.dev" autocomplete="off" spellcheck="false" />

        <label for="model">Gemini model</label>
        <select id="model">
          <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
        </select>

        <label for="translate-to">Translate to</label>
        <input id="translate-to" type="text" maxlength="40" placeholder="English" autocomplete="off" />

        <label class="check" for="double-click-menu">
          <input id="double-click-menu" type="checkbox" />
          Open the radial menu on double-click
        </label>
      </section>

      <section aria-labelledby="cursor-heading">
        <h2 id="cursor-heading">Cursor</h2>
        <label class="check" for="show-cursor">
          <input id="show-cursor" type="checkbox" />
          Show the cursor buddy
        </label>

        <label for="cursor-color">Color</label>
        <input id="cursor-color" type="color" value="#00ff88" />

        <label for="cursor-size">Size: <span id="cursor-size-value">24</span> px</label>
        <input id="cursor-size" type="range" min="16" max="48" step="2" value="24" />

        <label for="cursor-glow">Glow: <span id="cursor-glow-value">50</span>%</label>
        <input id="cursor-glow" type="range" min="0" max="100" step="10" value="50" />

        <div class="row">
          <button id="save" type="button">Save</button>
          <span id="saved" class="saved" role="status" aria-live="polite"></span>
        </div>
      </section>

      <section aria-labelledby="ask-heading">
        <h2 id="ask-heading">Ask by typing</h2>
        <form id="ask-form">
          <label for="ask-input" class="visually-hidden">Question</label>
          <input id="ask-input" type="text" placeholder="Ask about what's on your screen" autocomplete="off" />
          <button type="submit">Ask</button>
        </form>
      </section>

      <section aria-labelledby="last-heading">
        <h2 id="last-heading">Last exchange</h2>
        <p id="transcript" class="transcript"></p>
        <p id="response" class="response"></p>
        <p id="error" class="error" role="alert"></p>
      </section>

      <footer>
        <button id="quit" type="button" class="secondary">Quit ClickIt</button>
      </footer>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
