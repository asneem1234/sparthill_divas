<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>ClickIt Radial Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: none;
      user-select: none;
    }

    #radial-container {
      position: absolute;
      width: 400px;
      height: 400px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #center-orb {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 80px;
      height: 80px;
      margin: -40px 0 0 -40px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #00ff88, #00aa55);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.8), 
                  inset 0 0 20px rgba(255, 255, 255, 0.3);
      animation: pulse 2s ease-in-out infinite;
      pointer-events: auto;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .gem {
      position: absolute;
      width: 70px;
      height: 70px;
      left: 50%;
      top: 50%;
      margin: -35px 0 0 -35px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4a90e2, #2a5a8a);
      box-shadow: 0 0 20px rgba(74, 144, 226, 0.6);
      cursor: pointer;
      transition: all 0.3s ease;
      pointer-events: auto;
      opacity: 0;
      animation: gemAppear 0.5s ease forwards;
    }

    @keyframes gemAppear {
      from {
        opacity: 0;
        transform: translate(0, 0) scale(0.5);
      }
      to {
        opacity: 1;
        transform: var(--gem-position) scale(1);
      }
    }

    .gem:hover {
      transform: var(--gem-position) scale(1.2) !important;
      box-shadow: 0 0 35px rgba(74, 144, 226, 1);
      z-index: 10;
    }

    .gem.active {
      background: radial-gradient(circle at 30% 30%, #00ff88, #00aa55);
      box-shadow: 0 0 40px rgba(0, 255, 136, 1);
      transform: var(--gem-position) scale(1.3) !important;
    }

    .gem-icon {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .gem-label {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%);
      margin-top: 8px;
      padding: 4px 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff88;
      border-radius: 12px;
      font: 600 12px/1.2 'Segoe UI', sans-serif;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .gem:hover .gem-label,
    .gem.active .gem-label {
      opacity: 1;
    }

    #instructions {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff88;
      border-radius: 16px;
      font: 400 14px/1.4 'Segoe UI', sans-serif;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.5s ease;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    #close-hint {
      margin-top: 4px;
      font-size: 11px;
      color: #888;
    }

    /* Backdrop blur effect */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                                  rgba(0, 0, 0, 0.4), 
                                  rgba(0, 0, 0, 0.7));
      backdrop-filter: blur(3px);
      animation: backdropFade 0.3s ease;
      pointer-events: none;
    }

    @keyframes backdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="radial-container">
    <div id="center-orb"></div>
    
    <!-- Gems will be positioned in a circle -->
    <div class="gem" data-action="screenshot" style="--gem-position: translate(0, -140px);">
      <div class="gem-icon">📸</div>
      <div class="gem-label">Screenshot & Ask</div>
    </div>
    
    <div class="gem" data-action="voice" style="--gem-position: translate(120px, -70px);">
      <div class="gem-icon">🎤</div>
      <div class="gem-label">Voice Input</div>
    </div>
    
    <div class="gem" data-action="select-area" style="--gem-position: translate(140px, 70px);">
      <div class="gem-icon">✂️</div>
      <div class="gem-label">Select Area</div>
    </div>
    
    <div class="gem" data-action="translate" style="--gem-position: translate(0, 140px);">
      <div class="gem-icon">🌐</div>
      <div class="gem-label">Translate</div>
    </div>
    
    <div class="gem" data-action="reminders" style="--gem-position: translate(-140px, 70px);">
      <div class="gem-icon">⏰</div>
      <div class="gem-label">Reminders</div>
    </div>
    
    <div class="gem" data-action="settings" style="--gem-position: translate(-120px, -70px);">
      <div class="gem-icon">⚙️</div>
      <div class="gem-label">Settings</div>
    </div>
  </div>

  <div id="instructions">
    <div>Click a gem to choose an action</div>
    <div id="close-hint">Press ESC or click outside to close</div>
  </div>

  <script src="radial.js"></script>
</body>
</html>
