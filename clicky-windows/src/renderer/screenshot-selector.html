<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>ClickIt Screenshot Selector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.5);
      cursor: crosshair;
      user-select: none;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #selection-box {
      position: absolute;
      border: 2px solid #00ff88;
      background: rgba(0, 255, 136, 0.1);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      display: none;
    }

    #instructions {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff88;
      border-radius: 16px;
      font: 600 14px/1.4 'Segoe UI', sans-serif;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      animation: slideDown 0.3s ease;
      pointer-events: none;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    #dimensions {
      position: absolute;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff88;
      border-radius: 8px;
      font: 500 11px/1.2 'Courier New', monospace;
      pointer-events: none;
      display: none;
    }

    .hint {
      margin-top: 6px;
      font-size: 11px;
      color: #888;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="selection-box"></div>
  <div id="dimensions"></div>
  
  <div id="instructions">
    <div>Click and drag to select an area</div>
    <div class="hint">Press ESC to cancel • Release to capture</div>
  </div>

  <script src="screenshot-selector.js"></script>
</body>
</html>
