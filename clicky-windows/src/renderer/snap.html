<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:"
    />
    <link rel="stylesheet" href="popup.css" />
    <title>ClickIt Snap</title>
  </head>
  <body>
    <main>
      <header>
        <h1 id="title">Snap</h1>
        <button id="close" class="icon secondary" type="button" aria-label="Close">×</button>
      </header>

      <img id="preview" alt="Captured screenshot" />

      <p id="question"></p>
      <p id="answer" role="status" aria-live="polite">Working…</p>
      <p id="error" class="error" role="alert"></p>

      <form id="ask-form" class="row">
        <label for="ask-input" class="hidden">Question</label>
        <input id="ask-input" type="text" placeholder="Ask a follow-up about this image" autocomplete="off" />
        <button type="submit">Ask</button>
      </form>

      <form id="translate-form" class="row hidden">
        <label for="language" class="hidden">Translate to</label>
        <input id="language" type="text" placeholder="Translate to… (e.g. Hindi)" autocomplete="off" />
        <button type="submit">Translate</button>
      </form>

      <div class="row wrap">
        <button id="copy-text" class="secondary" type="button">Copy text</button>
        <button id="copy-image" class="secondary" type="button">Copy image</button>
        <button id="save-image" class="secondary" type="button">Save image</button>
      </div>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
    </main>
    <script src="snap.js"></script>
  </body>
</html>
